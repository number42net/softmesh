---
name: Build and Push Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: data.forgejo.org/oci/node:lts
    permissions:
      packages: write
    strategy:
      matrix:
        service: [mesh-gateway, room-server, home-auto-client, observer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install docker CLI
        run: apt-get update && apt-get install -y --no-install-recommends docker.io

      - name: Log in to Forgejo registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login gitea.other.svc.cluster.local:3000 -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.service }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE_TAG="${{ github.run_number }}-${SHORT_SHA}"
          REGISTRY=gitea.other.svc.cluster.local:3000/${{ github.repository_owner }}
          docker build \
            --build-arg "SERVICE=${{ matrix.service }}" \
            --tag "${REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}" \
            --tag "${REGISTRY}/${{ matrix.service }}:latest" \
            --file Dockerfile \
            .
          docker push "${REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${{ matrix.service }}:latest"
  flux-deploy:
    name: Wait for Flux deployment
    needs: build
    if: ${{ vars.FLUX_CD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: gitea.other.svc.cluster.local:3000/${{ github.repository_owner }}/kubernetes-repo-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Watch image promotion and Helm release
        env:
          FLUX_OBSERVER_KUBECONFIG: ${{ secrets.FLUX_OBSERVER_KUBECONFIG }}
        run: flux-app-wait '${{ github.run_number }}' '${{ github.sha }}' mesh-gateway room-server home-auto-client observer
